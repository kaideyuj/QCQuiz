<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457d6">
  <title>淡江品管班題庫</title>

  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --brand: #2457d6;
      --brand-soft: #edf2ff;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --ok-line: #22c55e;
      --bad: #c62828;
      --bad-bg: #fef2f2;
      --bad-line: #ef4444;
      --warning: #9a6700;
      --warning-bg: #fff8db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .app {
      max-width: 980px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 12px 42px;
    }

    .top {
      position: relative;
      min-height: 150px;
      padding: 22px 22px 52px;
      overflow: hidden;
      color: #ffffff;
      background: linear-gradient(135deg, #173c9b, #2d6be8);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(36, 87, 214, 0.20);
    }

    .top h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .top p {
      margin: 0;
      line-height: 1.5;
      opacity: 0.94;
    }

    .version-box {
      position: absolute;
      right: 18px;
      bottom: 12px;
      text-align: right;
      font-size: 11px;
      line-height: 1.45;
      opacity: 0.78;
    }

    .panel {
      padding: 18px;
      margin-top: 14px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .row-between {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .stack {
      align-items: stretch;
    }

    .grow {
      flex: 1;
    }

    .primary {
      color: #ffffff;
      background: var(--brand);
    }

    .secondary {
      color: var(--text);
      background: #e8edf6;
    }

    .danger {
      color: #ffffff;
      background: var(--bad);
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 12px 0;
    }

    .field label {
      font-weight: 700;
    }

    .field select,
    .field input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
    }

    .tiny {
      color: var(--muted);
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    .pill {
      display: inline-block;
      padding: 5px 9px;
      color: #1d4ed8;
      background: var(--brand-soft);
      border-radius: 999px;
      font-size: 13px;
    }

    .profile-card {
      padding: 12px;
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .profile-card strong {
      color: var(--brand);
    }

    .notice {
      padding: 10px 12px;
      margin: 10px 0;
      color: var(--warning);
      background: var(--warning-bg);
      border-radius: 10px;
      font-size: 14px;
    }

    .progress {
      height: 9px;
      margin: 13px 0;
      overflow: hidden;
      background: #e5e7eb;
      border-radius: 999px;
    }

    .progress div {
      height: 100%;
      background: var(--brand);
      transition: width 0.2s ease;
    }

    .qtitle {
      margin: 14px 0;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.65;
    }

    .option {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 14px;
      margin: 10px 0;
      line-height: 1.55;
      border: 1px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
      user-select: none;
    }

    .option:hover:not(.locked) {
      background: #f8fafc;
    }

    .option.selected {
      background: #f3f7ff;
      border-color: var(--brand);
    }

    .option.correct {
      color: var(--ok);
      background: var(--ok-bg);
      border-color: var(--ok-line);
    }

    .option.wrong {
      color: var(--bad);
      background: var(--bad-bg);
      border-color: var(--bad-line);
    }

    .option.locked {
      cursor: default;
    }

    .option input {
      margin-top: 4px;
      transform: scale(1.15);
    }

    .feedback {
      padding: 11px 13px;
      margin: 12px 0 4px;
      border-radius: 10px;
      font-weight: 700;
    }

    .feedback.correct {
      color: var(--ok);
      background: var(--ok-bg);
    }

    .feedback.wrong {
      color: var(--bad);
      background: var(--bad-bg);
    }

    .nav {
      display: grid;
      grid-template-areas:
        "previous next"
        "home home";
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    #prevBtn {
      grid-area: previous;
    }

    #nextBtn,
    #submitBtn {
      grid-area: next;
    }

    #homeBtn {
      grid-area: home;
    }

    .mode-card {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      margin: 14px 0;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .mode-card button {
      flex: 0 0 auto;
    }

    .score {
      margin: 6px 0;
      font-size: 42px;
      font-weight: 900;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .summary-card {
      padding: 12px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .summary-card .number {
      display: block;
      margin-bottom: 3px;
      font-size: 23px;
      font-weight: 900;
    }

    .table-wrap {
      width: 100%;
      margin-top: 12px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 9px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f3f6fb;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .text-ok {
      color: var(--ok);
      font-weight: 700;
    }

    .text-bad {
      color: var(--bad);
      font-weight: 700;
    }

    .lookup-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    @media (max-width: 720px) {
      .field-grid,
      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 520px) {
      .app {
        padding: 10px;
      }

      .top {
        padding: 18px 18px 58px;
      }

      .top h1 {
        font-size: 25px;
      }

      .qtitle {
        font-size: 18px;
      }

      .field-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .row.stack {
        display: grid;
      }

      .row.stack > * {
        width: 100%;
      }

      .lookup-row {
        grid-template-columns: 1fr;
      }

      .lookup-row button {
        width: 100%;
      }

      .mode-card {
        display: grid;
      }

      .mode-card button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- 標題區 -->
    <section class="top">
      <h1>淡江品管班題庫</h1>
      <p id="status">載入題庫中…</p>
      <div class="version-box">
        <div id="htmlVersion"></div>
        <div id="questionsVersion"></div>
      </div>
    </section>

    <!-- 主選單 -->
    <section id="home" class="panel">
      <h2>測驗設定</h2>

      <div class="field">
        <label for="userCode">使用者代號（選填）</label>
        <div class="lookup-row">
          <input
            id="userCode"
            type="text"
            maxlength="30"
            list="profileList"
            autocomplete="off"
            placeholder="可任意輸入，例如：A01、王小明"
          >
          <button class="secondary" type="button" onclick="applyUserCode()">載入／建立</button>
        </div>
        <datalist id="profileList"></datalist>
        <div class="small">未輸入代號時仍可測驗，但不會保存任何作答紀錄。</div>
      </div>

      <div id="profileInfo" class="profile-card"></div>

      <div class="mode-card">
        <div>
          <strong>依序作答模式</strong>
          <div id="sequentialHint" class="small">
            未指定使用者時，將從原題號 1 開始，且不保存進度。
          </div>
        </div>
        <button
          id="sequentialBtn"
          class="primary"
          type="button"
          onclick="startSequentialQuiz()"
        >
          從第 1 題開始
        </button>
      </div>

      <div class="field">
        <label for="unit">出題範圍</label>
        <select id="unit">
          <option value="">全部單元</option>
        </select>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="countSel">常用題數</label>
          <select id="countSel">
            <option value="10">10 題</option>
            <option value="20">20 題</option>
            <option value="50">50 題</option>
            <option value="100">100 題</option>
          </select>
        </div>

        <div class="field">
          <label for="customCount">自訂題數（選填）</label>
          <input
            id="customCount"
            type="number"
            min="1"
            max="2648"
            inputmode="numeric"
            placeholder="有填寫時優先採用"
          >
        </div>
      </div>

      <div class="row stack">
        <button class="primary grow" type="button" onclick="startQuiz(false)">隨機出題</button>
        <button class="secondary" type="button" onclick="startQuiz(true)">只考錯題</button>
        <button id="clearProfileBtn" class="danger hidden" type="button" onclick="clearCurrentProfile()">刪除此代號紀錄</button>
      </div>

      <div class="field">
        <label for="lookupId">依原題號查題</label>
        <div class="lookup-row">
          <input id="lookupId" type="number" min="1" max="2648" placeholder="例如：1816">
          <button class="secondary" type="button" onclick="lookupQuestion()">開啟題目</button>
        </div>
      </div>

      <p id="history" class="small"></p>
    </section>

    <!-- 答題區 -->
    <section id="quiz" class="panel hidden">
      <div class="row-between">
        <span id="pos" class="pill"></span>
        <span id="meta" class="small"></span>
      </div>

      <div class="progress">
        <div id="bar"></div>
      </div>

      <div id="qtext" class="qtitle"></div>
      <div id="opts"></div>
      <div id="feedback" class="feedback hidden"></div>

      <div class="nav">
        <button id="prevBtn" class="secondary" type="button" onclick="move(-1)">上一題</button>
        <button id="homeBtn" class="secondary" type="button" onclick="saveAndReturnHome()">回首頁</button>
        <button id="nextBtn" class="primary" type="button" onclick="move(1)">下一題</button>
        <button id="submitBtn" class="primary hidden" type="button" onclick="submitQuiz()">交卷</button>
      </div>
    </section>

    <!-- 結果區 -->
    <section id="result" class="panel hidden">
      <h2>測驗結果</h2>
      <div id="resultUser" class="small"></div>
      <div id="score" class="score"></div>
      <div id="summary" class="small"></div>

      <div id="overallTitle" class="hidden">
        <h3>此代號累計統計</h3>
        <div id="overallStats" class="summary-grid"></div>
      </div>

      <h3>本次題目統計明細</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>題號</th>
              <th>PDF頁</th>
              <th>題目</th>
              <th>本次答案</th>
              <th>正確答案</th>
              <th>本次結果</th>
              <th>累計作答</th>
              <th>累計正確</th>
              <th>累計錯誤</th>
              <th>累計正確率</th>
            </tr>
          </thead>
          <tbody id="statsBody"></tbody>
        </table>
      </div>

      <div class="row stack" style="margin-top: 16px;">
        <button class="primary grow" type="button" onclick="startQuiz(false)">重新測驗</button>
        <button class="secondary" type="button" onclick="returnHome()">回首頁</button>
      </div>
    </section>
  </div>

  <script>
    // ============================================================
    // 版本與題庫設定
    // ============================================================
    const HTML_VERSION = "v7";
    const HTML_BUILD_TIME = "2026-07-21 04:19";
    const QUESTIONS_VERSION = "v3";
    const QUESTIONS_BUILD_TIME = "2026-07-21 00:38";
    const DATA_FILE = "questions_v3.json";
    const DATA_CACHE_KEY = "questions-v3-202607210038";

    // 使用者紀錄只存在目前瀏覽器的 localStorage。
    const PROFILE_STORAGE_KEY = "qcQuizProfilesV4";
    const ACTIVE_USER_KEY = "qcQuizActiveUserV4";
    const MAX_SESSION_HISTORY = 50;

    let bank = [];
    let qs = [];
    let responses = {};
    let idx = 0;
    let quizContext = null;
    let activeUserCode = "";

    const $ = (id) => document.getElementById(id);

    $("htmlVersion").textContent = `HTML ${HTML_VERSION}｜${HTML_BUILD_TIME}`;
    $("questionsVersion").textContent = `Questions ${QUESTIONS_VERSION}｜${QUESTIONS_BUILD_TIME}`;

    // ============================================================
    // 通用工具
    // ============================================================
    function shuffle(items) {
      const copied = [...items];

      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }

      return copied;
    }

    function show(sectionId) {
      ["home", "quiz", "result"].forEach((id) => {
        $(id).classList.toggle("hidden", id !== sectionId);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function percent(numerator, denominator) {
      if (!denominator) {
        return "—";
      }

      return `${Math.round((numerator / denominator) * 100)}%`;
    }

    // ============================================================
    // 使用者代號與本機紀錄
    // ============================================================
    function emptyStore() {
      return {
        profiles: {}
      };
    }

    function nonNegativeInteger(value) {
      return Number.isInteger(value) && value >= 0 ? value : 0;
    }

    function normalizeQuestionStats(questionStats) {
      if (!questionStats || typeof questionStats !== "object" || Array.isArray(questionStats)) {
        return {};
      }

      return Object.fromEntries(
        Object.entries(questionStats).map(([questionId, stats]) => {
          const safeStats = stats && typeof stats === "object" ? stats : {};

          return [questionId, {
            ...safeStats,
            attempts: nonNegativeInteger(safeStats.attempts),
            correct: nonNegativeInteger(safeStats.correct),
            wrong: nonNegativeInteger(safeStats.wrong),
            lastAnswer: safeStats.lastAnswer ?? null,
            lastCorrect: safeStats.lastCorrect ?? null,
            lastAt: safeStats.lastAt ?? null
          }];
        })
      );
    }

    function normalizeProfile(code, profile) {
      const safeProfile = profile && typeof profile === "object" ? profile : {};
      const safeSummary = safeProfile.summary && typeof safeProfile.summary === "object"
        ? safeProfile.summary
        : {};
      const safeProgress = safeProfile.sequentialProgress
        && typeof safeProfile.sequentialProgress === "object"
        ? safeProfile.sequentialProgress
        : {};

      return {
        ...safeProfile,
        code: typeof safeProfile.code === "string" ? safeProfile.code : code,
        createdAt: safeProfile.createdAt ?? null,
        updatedAt: safeProfile.updatedAt ?? null,
        summary: {
          ...safeSummary,
          quizCount: nonNegativeInteger(safeSummary.quizCount),
          answeredCount: nonNegativeInteger(safeSummary.answeredCount),
          correctCount: nonNegativeInteger(safeSummary.correctCount),
          wrongCount: nonNegativeInteger(safeSummary.wrongCount)
        },
        questionStats: normalizeQuestionStats(safeProfile.questionStats),
        sessions: Array.isArray(safeProfile.sessions) ? safeProfile.sessions : [],
        sequentialProgress: {
          ...safeProgress,
          questionId: Number.isInteger(Number(safeProgress.questionId))
            ? Number(safeProgress.questionId)
            : 1,
          updatedAt: safeProgress.updatedAt ?? null
        }
      };
    }

    function normalizeStore(parsed) {
      if (!parsed || typeof parsed !== "object" || !parsed.profiles
        || typeof parsed.profiles !== "object" || Array.isArray(parsed.profiles)) {
        return emptyStore();
      }

      return {
        ...parsed,
        profiles: Object.fromEntries(
          Object.entries(parsed.profiles).map(([code, profile]) => [
            code,
            normalizeProfile(code, profile)
          ])
        )
      };
    }

    function loadStore() {
      try {
        const parsed = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || "null");

        return normalizeStore(parsed);
      } catch (error) {
        return emptyStore();
      }
    }

    function saveStore(store) {
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(store));
    }

    function createProfile(code) {
      const timestamp = nowIso();

      return {
        code,
        createdAt: timestamp,
        updatedAt: timestamp,
        summary: {
          quizCount: 0,
          answeredCount: 0,
          correctCount: 0,
          wrongCount: 0
        },
        questionStats: {},
        sessions: [],
        sequentialProgress: {
          questionId: 1,
          updatedAt: null
        }
      };
    }

    function getActiveProfile() {
      if (!activeUserCode) {
        return null;
      }

      const store = loadStore();
      return store.profiles[activeUserCode] || null;
    }

    function refreshProfileList() {
      const store = loadStore();
      const dataList = $("profileList");
      dataList.innerHTML = "";

      Object.keys(store.profiles)
        .sort((a, b) => a.localeCompare(b, "zh-Hant"))
        .forEach((code) => {
          const option = document.createElement("option");
          option.value = code;
          dataList.appendChild(option);
        });
    }

    function applyUserCode() {
      const code = $("userCode").value.trim();

      if (!code) {
        activeUserCode = "";
        localStorage.removeItem(ACTIVE_USER_KEY);
        updateProfileInfo();
        return;
      }

      const store = loadStore();

      if (!store.profiles[code]) {
        store.profiles[code] = createProfile(code);
        saveStore(store);
      }

      activeUserCode = code;
      localStorage.setItem(ACTIVE_USER_KEY, code);
      $("userCode").value = code;
      refreshProfileList();
      updateProfileInfo();
    }

    function updateProfileInfo() {
      const box = $("profileInfo");
      const clearButton = $("clearProfileBtn");
      const profile = getActiveProfile();

      if (!profile) {
        box.innerHTML = "<strong>訪客模式</strong><div class=\"small\">本次作答不會寫入瀏覽器紀錄。</div>";
        clearButton.classList.add("hidden");
        updateSequentialModeInfo();
        updateHistory();
        return;
      }

      const summary = profile.summary;
      const accuracy = percent(summary.correctCount, summary.answeredCount);

      const sequentialQuestionId = getSequentialProgressQuestionId(profile);

      box.innerHTML = `
        <strong>目前代號：${escapeHtml(profile.code)}</strong>
        <div class="small">
          完成 ${summary.quizCount} 次測驗｜作答 ${summary.answeredCount} 題｜
          正確 ${summary.correctCount} 題｜錯誤 ${summary.wrongCount} 題｜正確率 ${accuracy}
        </div>
        <div class="small">
          依序作答進度：下次從原題號 ${sequentialQuestionId} 開始。
        </div>
      `;

      clearButton.classList.remove("hidden");
      updateSequentialModeInfo();
      updateHistory();
    }

    function getSequentialProgressQuestionId(profile) {
      const candidate = Number(profile?.sequentialProgress?.questionId);

      if (Number.isInteger(candidate) && bank.some((question) => question.id === candidate)) {
        return candidate;
      }

      return 1;
    }

    function updateSequentialModeInfo() {
      const hint = $("sequentialHint");
      const button = $("sequentialBtn");

      if (!hint || !button) {
        return;
      }

      const profile = getActiveProfile();

      if (!profile) {
        hint.textContent = "未指定使用者時，將從原題號 1 開始，且不保存進度。";
        button.textContent = "從第 1 題開始";
        return;
      }

      const questionId = getSequentialProgressQuestionId(profile);
      hint.textContent = `代號「${profile.code}」已保存進度，下次從原題號 ${questionId} 開始。`;
      button.textContent = questionId === 1
        ? "從第 1 題開始"
        : `從第 ${questionId} 題續答`;
    }

    function saveSequentialProgress(questionId, refreshHome = false) {
      if (!activeUserCode || !quizContext?.sequential) {
        return;
      }

      const validQuestionId = Number(questionId);

      if (!bank.some((question) => question.id === validQuestionId)) {
        return;
      }

      const store = loadStore();
      const profile = store.profiles[activeUserCode] || createProfile(activeUserCode);
      const timestamp = nowIso();

      profile.sequentialProgress = {
        questionId: validQuestionId,
        updatedAt: timestamp
      };
      profile.updatedAt = timestamp;
      store.profiles[activeUserCode] = profile;
      saveStore(store);

      if (refreshHome) {
        updateProfileInfo();
      }
    }

    function updateHistory() {
      const profile = getActiveProfile();

      if (!profile) {
        $("history").textContent = "未指定使用者代號，不保存歷史紀錄。";
        return;
      }

      if (!profile.sessions.length) {
        $("history").textContent = `代號「${profile.code}」尚無測驗紀錄。`;
        return;
      }

      const recent = profile.sessions
        .slice(-5)
        .reverse()
        .map((session) => `${session.score}分`)
        .join("、");

      $("history").textContent = `代號「${profile.code}」最近成績：${recent}`;
    }

    function clearCurrentProfile() {
      if (!activeUserCode) {
        return;
      }

      const message = `確定刪除代號「${activeUserCode}」的所有作答紀錄？`;

      if (!window.confirm(message)) {
        return;
      }

      const store = loadStore();
      delete store.profiles[activeUserCode];
      saveStore(store);

      activeUserCode = "";
      $("userCode").value = "";
      localStorage.removeItem(ACTIVE_USER_KEY);

      refreshProfileList();
      updateProfileInfo();
    }

    function restoreActiveUser() {
      const savedCode = (localStorage.getItem(ACTIVE_USER_KEY) || "").trim();
      const store = loadStore();

      if (savedCode && store.profiles[savedCode]) {
        activeUserCode = savedCode;
        $("userCode").value = savedCode;
      }

      refreshProfileList();
      updateProfileInfo();
    }

    // ============================================================
    // 題庫載入與主選單
    // ============================================================
    function validateQuestionBank(data) {
      if (!Array.isArray(data) || !data.length) {
        throw new Error("題庫不是有效的題目陣列。");
      }

      const ids = new Set();

      data.forEach((question) => {
        const isQuestionObject = question
          && typeof question === "object"
          && !Array.isArray(question);
        const hasValidOptions = isQuestionObject && question.options
          && typeof question.options === "object"
          && !Array.isArray(question.options);
        const optionKeys = hasValidOptions ? Object.keys(question.options) : [];
        const hasValidChoiceOrder = isQuestionObject && Array.isArray(question.choice_order)
          && question.choice_order.length === optionKeys.length
          && question.choice_order.every((key) => optionKeys.includes(key));

        if (!isQuestionObject || !Number.isInteger(question.id) || ids.has(question.id)
          || typeof question.question !== "string" || !question.question.trim()
          || !hasValidOptions || !optionKeys.length
          || !optionKeys.includes(question.answer) || !hasValidChoiceOrder) {
          throw new Error(`題庫第 ${question?.id ?? "未知"} 題格式錯誤。`);
        }

        ids.add(question.id);
      });

      return data;
    }

    fetch(`${DATA_FILE}?v=${DATA_CACHE_KEY}`, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error(String(response.status));
        }

        return response.json();
      })
      .then((data) => {
        bank = validateQuestionBank(data);
        $("status").textContent = `完整題庫 ${bank.length.toLocaleString()} 題｜手機、iPad、電腦皆可使用`;

        [...new Set(bank.map((question) => question.unit))]
          .filter(Boolean)
          .forEach((unitName) => {
            const option = document.createElement("option");
            option.value = unitName;
            option.textContent = unitName;
            $("unit").appendChild(option);
          });

        restoreActiveUser();
      })
      .catch(() => {
        $("status").innerHTML = `
          <span class="text-bad">
            題庫載入失敗：請確認 index.html 與 ${DATA_FILE} 位於同一層。
          </span>
        `;
      });

    function resolveRequestedCount(poolLength) {
      const customValue = Number.parseInt($("customCount").value, 10);
      const presetValue = Number.parseInt($("countSel").value, 10);
      const requested = Number.isInteger(customValue) && customValue > 0
        ? customValue
        : presetValue;

      return Math.max(1, Math.min(requested, poolLength));
    }

    function startSequentialQuiz() {
      if (!bank.length) {
        return;
      }

      applyUserCode();

      const profile = getActiveProfile();
      const startQuestionId = profile
        ? getSequentialProgressQuestionId(profile)
        : 1;

      qs = bank
        .filter((question) => question.id >= startQuestionId)
        .sort((a, b) => a.id - b.id);

      if (!qs.length) {
        window.alert("找不到可接續的題目，將從第 1 題重新開始。");
        qs = [...bank].sort((a, b) => a.id - b.id);
      }

      responses = {};
      idx = 0;
      quizContext = {
        startedAt: nowIso(),
        unit: "全部單元",
        mode: "依序作答",
        requestedCount: qs.length,
        userCode: activeUserCode,
        sequential: true,
        sequentialStartId: qs[0]?.id || 1
      };

      show("quiz");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startQuiz(wrongOnly) {
      if (!bank.length) {
        return;
      }

      // 將目前輸入框內容套用為使用者代號；空白即訪客模式。
      applyUserCode();

      let pool = bank;
      const selectedUnit = $("unit").value;

      if (selectedUnit) {
        pool = pool.filter((question) => question.unit === selectedUnit);
      }

      if (wrongOnly) {
        const profile = getActiveProfile();

        if (!profile) {
          window.alert("錯題庫需要先輸入使用者代號，才能讀取保存的錯題紀錄。");
          return;
        }

        const wrongIds = new Set(
          Object.entries(profile.questionStats)
            .filter(([, stats]) => stats.wrong > 0)
            .map(([questionId]) => Number(questionId))
        );

        pool = pool.filter((question) => wrongIds.has(question.id));

        if (!pool.length) {
          window.alert("目前沒有符合範圍的錯題。");
          return;
        }
      }

      if (!pool.length) {
        window.alert("目前範圍沒有可出題的題目。");
        return;
      }

      const count = resolveRequestedCount(pool.length);
      qs = shuffle(pool).slice(0, count);
      responses = {};
      idx = 0;
      quizContext = {
        startedAt: nowIso(),
        unit: selectedUnit || "全部單元",
        mode: wrongOnly ? "錯題練習" : "隨機測驗",
        requestedCount: count,
        userCode: activeUserCode,
        sequential: false
      };

      show("quiz");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function lookupQuestion() {
      if (!bank.length) {
        return;
      }

      applyUserCode();

      const questionId = Number($("lookupId").value);
      const question = bank.find((item) => item.id === questionId);

      if (!question) {
        window.alert("找不到該題號。");
        return;
      }

      qs = [question];
      responses = {};
      idx = 0;
      quizContext = {
        startedAt: nowIso(),
        unit: question.unit,
        mode: "指定題號",
        requestedCount: 1,
        userCode: activeUserCode,
        sequential: false
      };

      show("quiz");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ============================================================
    // 答題與即時判定
    // ============================================================
    function answerQuestion(question, selectedKey) {
      if (responses[question.id]) {
        return;
      }

      responses[question.id] = {
        selected: selectedKey,
        isCorrect: selectedKey === question.answer,
        answeredAt: nowIso()
      };

      render();
    }

    function render() {
      const question = qs[idx];
      const response = responses[question.id] || null;

      if (quizContext?.sequential) {
        $("pos").textContent = `依序作答｜原題號 ${question.id} / ${bank.length}`;
        $("bar").style.width = `${(question.id / bank.length) * 100}%`;
      } else {
        $("pos").textContent = `第 ${idx + 1} / ${qs.length} 題`;
        $("bar").style.width = `${((idx + 1) / qs.length) * 100}%`;
      }

      $("meta").textContent = `原題號 ${question.id}｜PDF 第 ${question.page} 頁`;
      $("qtext").textContent = question.question;

      const optionsBox = $("opts");
      optionsBox.innerHTML = "";

      question.choice_order.forEach((key) => {
        const label = document.createElement("label");
        const isCorrectOption = response && key === question.answer;
        const isSelectedWrong = response
          && key === response.selected
          && response.selected !== question.answer;

        const classes = ["option"];

        if (response) {
          classes.push("locked");
        }

        if (isCorrectOption) {
          classes.push("correct");
        }

        if (isSelectedWrong) {
          classes.push("wrong");
        }

        label.className = classes.join(" ");
        label.innerHTML = `
          <input
            type="radio"
            name="opt"
            ${response?.selected === key ? "checked" : ""}
            ${response ? "disabled" : ""}
          >
          <span><b>${key}.</b> ${escapeHtml(question.options[key])}</span>
        `;

        label.addEventListener("click", () => {
          answerQuestion(question, key);
        });

        optionsBox.appendChild(label);
      });

      renderFeedback(question, response);
      renderNavigation();

      if (quizContext?.sequential) {
        saveSequentialProgress(question.id);
      }
    }

    function renderFeedback(question, response) {
      const feedback = $("feedback");

      if (!response) {
        feedback.className = "feedback hidden";
        feedback.textContent = "";
        return;
      }

      if (response.isCorrect) {
        feedback.className = "feedback correct";
        feedback.textContent = `答對：${question.answer}．${question.options[question.answer]}`;
      } else {
        feedback.className = "feedback hidden";
        feedback.textContent = "";
      }
    }

    function renderNavigation() {
      const isFirstQuestion = idx === 0;
      const isLastQuestion = idx === qs.length - 1;

      $("prevBtn").disabled = isFirstQuestion;
      $("nextBtn").classList.toggle("hidden", isLastQuestion);
      $("submitBtn").classList.toggle("hidden", !isLastQuestion);
    }

    function move(direction) {
      idx = Math.max(0, Math.min(qs.length - 1, idx + direction));
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ============================================================
    // 交卷、保存與統計
    // ============================================================
    function buildSessionResult() {
      const details = qs.map((question) => {
        const response = responses[question.id] || null;

        return {
          id: question.id,
          selected: response?.selected || null,
          answer: question.answer,
          isCorrect: response ? response.isCorrect : null
        };
      });

      const answeredCount = details.filter((item) => item.selected !== null).length;
      const correctCount = details.filter((item) => item.isCorrect === true).length;
      const wrongCount = details.filter((item) => item.isCorrect === false).length;
      const unansweredCount = details.length - answeredCount;
      const score = Math.round((correctCount / details.length) * 100);

      return {
        id: `session-${Date.now()}`,
        startedAt: quizContext?.startedAt || nowIso(),
        completedAt: nowIso(),
        unit: quizContext?.unit || "",
        mode: quizContext?.mode || "",
        questionCount: details.length,
        answeredCount,
        correctCount,
        wrongCount,
        unansweredCount,
        score,
        details
      };
    }

    function saveSessionForActiveUser(session) {
      if (!activeUserCode) {
        return null;
      }

      const store = loadStore();
      const profile = store.profiles[activeUserCode] || createProfile(activeUserCode);

      session.details.forEach((detail) => {
        if (!detail.selected) {
          return;
        }

        const key = String(detail.id);
        const stats = profile.questionStats[key] || {
          attempts: 0,
          correct: 0,
          wrong: 0,
          lastAnswer: null,
          lastCorrect: null,
          lastAt: null
        };

        stats.attempts += 1;

        if (detail.isCorrect) {
          stats.correct += 1;
        } else {
          stats.wrong += 1;
        }

        stats.lastAnswer = detail.selected;
        stats.lastCorrect = detail.isCorrect;
        stats.lastAt = session.completedAt;
        profile.questionStats[key] = stats;
      });

      profile.summary.quizCount += 1;
      profile.summary.answeredCount += session.answeredCount;
      profile.summary.correctCount += session.correctCount;
      profile.summary.wrongCount += session.wrongCount;
      profile.updatedAt = session.completedAt;
      profile.sessions.push(session);
      profile.sessions = profile.sessions.slice(-MAX_SESSION_HISTORY);

      store.profiles[activeUserCode] = profile;
      saveStore(store);

      return profile;
    }

    function submitQuiz() {
      const unansweredCount = qs.filter((question) => !responses[question.id]).length;

      if (unansweredCount > 0) {
        const confirmed = window.confirm(
          `尚有 ${unansweredCount} 題未作答。未作答不會計入個別題目的作答次數，確定交卷？`
        );

        if (!confirmed) {
          return;
        }
      }

      const session = buildSessionResult();
      const savedProfile = saveSessionForActiveUser(session);

      if (quizContext?.sequential && activeUserCode) {
        saveSequentialProgress(1);
      }

      renderResult(session, savedProfile);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderResult(session, savedProfile) {
      const userLabel = activeUserCode
        ? `使用者代號：${activeUserCode}（已保存）`
        : "訪客模式（本次結果未保存）";

      $("resultUser").textContent = userLabel;
      $("score").textContent = `${session.score} 分`;
      $("summary").textContent = [
        `共 ${session.questionCount} 題`,
        `已作答 ${session.answeredCount} 題`,
        `正確 ${session.correctCount} 題`,
        `錯誤 ${session.wrongCount} 題`,
        `未作答 ${session.unansweredCount} 題`
      ].join("｜");

      renderOverallStats(savedProfile);
      renderQuestionStatsTable(session, savedProfile);
    }

    function renderOverallStats(profile) {
      const title = $("overallTitle");
      const container = $("overallStats");

      if (!profile) {
        title.classList.add("hidden");
        container.innerHTML = "";
        return;
      }

      title.classList.remove("hidden");
      const summary = profile.summary;
      const accuracy = percent(summary.correctCount, summary.answeredCount);

      container.innerHTML = `
        <div class="summary-card">
          <span class="number">${summary.quizCount}</span>
          <span class="small">完成測驗</span>
        </div>
        <div class="summary-card">
          <span class="number">${summary.answeredCount}</span>
          <span class="small">累計作答</span>
        </div>
        <div class="summary-card">
          <span class="number">${summary.correctCount} / ${summary.wrongCount}</span>
          <span class="small">正確／錯誤</span>
        </div>
        <div class="summary-card">
          <span class="number">${accuracy}</span>
          <span class="small">累計正確率</span>
        </div>
      `;
    }

    function renderQuestionStatsTable(session, profile) {
      const body = $("statsBody");
      body.innerHTML = "";

      session.details.forEach((detail) => {
        const cumulative = profile?.questionStats?.[String(detail.id)] || null;
        const resultText = detail.isCorrect === true
          ? "正確"
          : detail.isCorrect === false
            ? "錯誤"
            : "未作答";
        const resultClass = detail.isCorrect === true
          ? "text-ok"
          : detail.isCorrect === false
            ? "text-bad"
            : "";

        const question = qs.find((item) => item.id === detail.id);
        const selectedText = detail.selected && question
          ? `${detail.selected}．${question.options[detail.selected]}`
          : "—";
        const correctText = question
          ? `${detail.answer}．${question.options[detail.answer]}`
          : detail.answer;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${detail.id}</td>
          <td>${question?.page ?? "—"}</td>
          <td>${question ? escapeHtml(question.question) : "—"}</td>
          <td>${escapeHtml(selectedText)}</td>
          <td>${escapeHtml(correctText)}</td>
          <td class="${resultClass}">${resultText}</td>
          <td>${cumulative?.attempts ?? "—"}</td>
          <td>${cumulative?.correct ?? "—"}</td>
          <td>${cumulative?.wrong ?? "—"}</td>
          <td>${cumulative ? percent(cumulative.correct, cumulative.attempts) : "—"}</td>
        `;

        body.appendChild(row);
      });
    }

    function saveAndReturnHome() {
      const currentQuestion = qs[idx];

      if (quizContext?.sequential && currentQuestion) {
        saveSequentialProgress(currentQuestion.id);
      }

      returnHome();
    }

    function returnHome() {
      show("home");
      refreshProfileList();
      updateProfileInfo();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 允許在使用者代號欄按 Enter 直接載入／建立。
    $("userCode").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyUserCode();
      }
    });
  </script>
</body>
</html>
