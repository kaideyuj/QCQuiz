<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>淡江品管班題庫</title><style>
:root{--bg:#eef2f7;--card:#fff;--text:#172033;--muted:#667085;--line:#d8dee9;--brand:#2457d6;--ok:#15803d;--bad:#c62828}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:820px;margin:auto;min-height:100vh;padding:16px 12px 42px}.top{background:linear-gradient(135deg,#173c9b,#2d6be8);color:#fff;border-radius:18px;padding:22px}.top h1{margin:0 0 6px;font-size:25px}.top p{margin:0;opacity:.9}.panel{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#e8edf6;color:#172033}.grow{flex:1}.field{display:grid;gap:6px;margin:10px 0}.field select,.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.small{font-size:14px;color:var(--muted)}.hidden{display:none}.pill{display:inline-block;background:#edf2ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:13px}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:13px 0}.progress div{height:100%;background:var(--brand)}.qtitle{font-size:19px;line-height:1.65;font-weight:800;margin:14px 0}.option{display:block;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;line-height:1.5;cursor:pointer}.option.selected{border-color:var(--brand);background:#f3f7ff}.option input{margin-right:9px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.score{font-size:42px;font-weight:900}.mistake{border-top:1px solid var(--line);padding:14px 0}.ok{color:var(--ok);font-weight:700}.error{color:var(--bad)}@media(max-width:520px){.app{padding:10px}.qtitle{font-size:18px}.top{padding:18px}.row.stack{display:grid}.row.stack>*{width:100%}}</style></head><body><div class="app"><section class="top"><h1>淡江品管班題庫</h1><p id="status">載入完整題庫中…</p></section>
<section id="home" class="panel"><div class="field"><label>出題範圍</label><select id="unit"><option value="">全部單元</option></select></div><div class="field"><label>題數</label><select id="countSel"><option>10</option><option>20</option><option>50</option><option>100</option></select></div><div class="row stack"><button class="primary grow" onclick="startQuiz(false)">隨機出題</button><button class="secondary" onclick="startQuiz(true)">只考錯題</button><button class="secondary" onclick="clearRecords()">清除紀錄</button></div><p id="history" class="small"></p></section>
<section id="quiz" class="panel hidden"><div class="row" style="justify-content:space-between"><span id="pos" class="pill"></span><span id="meta" class="small"></span></div><div class="progress"><div id="bar"></div></div><div id="qtext" class="qtitle"></div><div id="opts"></div><div class="nav"><button class="secondary" onclick="move(-1)">上一題</button><button class="primary" onclick="move(1)">下一題</button></div><button class="primary" style="width:100%;margin-top:10px" onclick="submitQuiz()">交卷</button></section>
<section id="result" class="panel hidden"><h2>測驗結果</h2><div id="score" class="score"></div><div id="summary" class="small"></div><div id="mistakes"></div><div class="row stack"><button class="primary grow" onclick="startQuiz(false)">重新測驗</button><button class="secondary" onclick="show('home');updateHistory()">回首頁</button></div></section></div><script>
let bank=[],qs=[],answers={},idx=0;const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function records(){return JSON.parse(localStorage.getItem('qcRecords')||'{"history":[],"wrong":[]}')}function save(r){localStorage.setItem('qcRecords',JSON.stringify(r))}function updateHistory(){let r=records();$('history').textContent=r.history.length?'最近成績：'+r.history.slice(-5).reverse().map(x=>x+'分').join('、')+'｜錯題庫 '+r.wrong.length+' 題':'尚無作答紀錄'}
fetch('questions.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{bank=data;$('status').textContent=`完整題庫 ${bank.length.toLocaleString()} 題｜手機、iPad、電腦皆可使用`;let units=[...new Set(bank.map(q=>q.unit))].filter(Boolean);units.forEach(u=>{let o=document.createElement('option');o.value=u;o.textContent=u;$('unit').appendChild(o)});updateHistory()}).catch(e=>{$('status').innerHTML='<span class="error">題庫載入失敗，請確認 questions.json 已與 index.html 放在同一層。</span>'});
function startQuiz(wrongOnly){if(!bank.length)return;let pool=bank;let unit=$('unit').value;if(unit)pool=pool.filter(q=>q.unit===unit);if(wrongOnly){let ids=new Set(records().wrong);pool=pool.filter(q=>ids.has(q.id));if(!pool.length){alert('目前沒有符合範圍的錯題');return}}let n=Math.min(+$('countSel').value,pool.length);qs=shuffle(pool).slice(0,n);answers={};idx=0;show('quiz');render()}function render(){let q=qs[idx];$('pos').textContent=`第 ${idx+1} / ${qs.length} 題`;$('meta').textContent=`原題號 ${q.id}｜PDF第 ${q.page}頁`;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('qtext').textContent=q.question;let box=$('opts');box.innerHTML='';for(let k of 'ABCD'){let l=document.createElement('label');l.className='option'+(answers[q.id]===k?' selected':'');l.innerHTML=`<input type="radio" name="opt" ${answers[q.id]===k?'checked':''}><b>${k}.</b> ${q.options[k]}`;l.onclick=()=>{answers[q.id]=k;render()};box.appendChild(l)}}function move(d){idx=Math.max(0,Math.min(qs.length-1,idx+d));render()}function submitQuiz(){let correct=0,wrong=[];for(let q of qs){if(answers[q.id]===q.answer)correct++;else wrong.push(q)}let score=Math.round(correct/qs.length*100),r=records();r.history.push(score);r.history=r.history.slice(-30);let set=new Set(r.wrong);for(let q of qs){if(answers[q.id]===q.answer)set.delete(q.id);else set.add(q.id)}r.wrong=[...set];save(r);$('score').textContent=score+' 分';$('summary').textContent=`答對 ${correct} 題，答錯或未作答 ${qs.length-correct} 題`;let m=$('mistakes');m.innerHTML=wrong.length?'<h3>錯題檢討</h3>':'<h3>全部答對</h3>';wrong.forEach(q=>{let d=document.createElement('div');d.className='mistake';d.innerHTML=`<div class="small">原題號 ${q.id}｜PDF第 ${q.page}頁</div><div style="font-weight:700;line-height:1.5;margin:6px 0">${q.question}</div><div>你的答案：${answers[q.id]||'未作答'}</div><div class="ok">正確答案：${q.answer}．${q.options[q.answer]}</div>`;m.appendChild(d)});show('result');scrollTo({top:0,behavior:'smooth'})}function clearRecords(){if(confirm('確定清除成績與錯題紀錄？')){localStorage.removeItem('qcRecords');updateHistory()}}</script></body></html>
