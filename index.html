<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>淡江品管班測驗</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--text:#172033;--muted:#667085;--line:#d8dee9;--brand:#2457d6;--ok:#15803d;--bad:#c62828}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 14px 40px}
.top{background:linear-gradient(135deg,#173c9b,#2d6be8);color:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(36,87,214,.22)}
.top h1{margin:0 0 6px;font-size:25px} .top p{margin:0;opacity:.9}
.panel{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} button{appearance:none;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer}
.primary{background:var(--brand);color:#fff;flex:1} .secondary{background:#e8edf6;color:#172033}
.progressbar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:14px 0 5px} .progressbar>div{height:100%;background:var(--brand);width:0;transition:.25s}
.small{font-size:14px;color:var(--muted)} .qtitle{font-size:19px;line-height:1.65;font-weight:800;margin:14px 0}
.option{display:block;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;line-height:1.5;cursor:pointer;background:#fff}
.option input{margin-right:9px;transform:scale(1.15)} .option.selected{border-color:var(--brand);background:#f3f7ff}
.correct{border-color:#22c55e!important;background:#f0fdf4!important} .wrong{border-color:#ef4444!important;background:#fef2f2!important}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hidden{display:none} .score{font-size:42px;font-weight:900;margin:6px 0} .mistake{border-top:1px solid var(--line);padding:14px 0} .pill{display:inline-block;background:#edf2ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:13px}
@media(max-width:520px){.app{padding:12px 10px 30px}.top{padding:18px}.qtitle{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<section class="top">
<h1>淡江品管班測驗</h1>
<p>10 題試作版｜手機、iPad、電腦皆可使用</p>
</section>

<section id="home" class="panel">
<h2>開始測驗</h2>
<p class="small">題目會隨機排序，作答後可查看成績與錯題。</p>
<div class="row">
<button class="primary" onclick="startQuiz()">隨機 10 題</button>
<button class="secondary" onclick="clearHistory()">清除紀錄</button>
</div>
<p id="history" class="small"></p>
</section>

<section id="quiz" class="panel hidden">
<div class="row" style="justify-content:space-between">
<span id="count" class="pill"></span><span id="unit" class="small"></span>
</div>
<div class="progressbar"><div id="bar"></div></div>
<div id="qid" class="small"></div>
<div id="question" class="qtitle"></div>
<div id="options"></div>
<div class="nav">
<button class="secondary" onclick="prevQ()">上一題</button>
<button class="primary" onclick="nextQ()">下一題</button>
</div>
<button class="primary" style="width:100%;margin-top:10px" onclick="submitQuiz()">交卷</button>
</section>

<section id="result" class="panel hidden">
<h2>測驗結果</h2>
<div id="score" class="score"></div>
<div id="summary" class="small"></div>
<div id="mistakes"></div>
<div class="row" style="margin-top:16px">
<button class="primary" onclick="startQuiz()">重新測驗</button>
<button class="secondary" onclick="goHome()">回首頁</button>
</div>
</section>
</div>

<script>
const bank=[{"id": 1, "unit": "單元一：政府採購全生命週期概論", "question": "依公共建設工程經費估算編列手冊總則篇，以下何者非屬工程建造費之編列架構？", "options": {"A": "直接工程成本", "B": "間接工程成本", "C": "用地取得及拆遷補償費用", "D": "工程預備費"}, "answer": "C"}, {"id": 2, "unit": "單元一：政府採購全生命週期概論", "question": "下列因應物價波動之方式，何者非屬妥適？", "options": {"A": "計畫階段預為編列物調費及預備費", "B": "個案契約依工程會工程採購契約範本採用3層級物調規定", "C": "工程招標時請廠商提出放棄物調聲明書", "D": "招標文件公告前再次訪查市場行情"}, "answer": "C"}, {"id": 3, "unit": "單元一：政府採購全生命週期概論", "question": "下列何者非政府協調改善本國營造業工缺工之措施？", "options": {"A": "合理檢討移工規定", "B": "加強本國勞工訓練媒合", "C": "推動營建自動化", "D": "全面開放移工進駐工地"}, "answer": "D"}, {"id": 4, "unit": "單元一：政府採購全生命週期概論", "question": "依政府公共工程計畫與經費審議作業要點基本設計階段之必要圖說之規定，機關當次送審基本設計之工程建造經費達新臺幣多少時，應辦理替選方案評估，並將替選方案評估報告納為必要圖說文件？", "options": {"A": "10億元", "B": "4億元", "C": "1億元", "D": "5千萬元"}, "answer": "A"}, {"id": 5, "unit": "單元一：政府採購全生命週期概論", "question": "依共同性費用編列基準，專案研析後得計列之項目，不包含下列何者？", "options": {"A": "基地一般性整理", "B": "綠建築", "C": "挑高空間", "D": "智慧建築"}, "answer": "A"}, {"id": 6, "unit": "單元一：政府採購全生命週期概論", "question": "下列何者非屬「契約書圖條件不合理」之情形？", "options": {"A": "保固年限過長", "B": "訂定技術規格時，以功能或效益等精確方式說明招標需求，而不提供參考品牌", "C": "材料綁標", "D": "設計內容過簡要求廠商負設計責任"}, "answer": "B"}, {"id": 7, "unit": "單元一：政府採購全生命週期概論", "question": "機關應務實評選規劃設計廠商，評定實務可行之方案，評選委員及工作小組應於評選前瞭解之事項包含？1.計畫需求與預算。2.期程。3.各廠商投標內容。4.契約變更方案。", "options": {"A": "1、2、3、4", "B": "1、2、3", "C": "1、2、4", "D": "2、3、4"}, "answer": "B"}, {"id": 8, "unit": "單元一：政府採購全生命週期概論", "question": "機關辦理採購應核實編列計畫預算，下列何者非考量之因素？", "options": {"A": "機關需求", "B": "使用年限", "C": "未來契約可能因廠商違約重行招標之經費", "D": "維護管理"}, "answer": "C"}, {"id": 9, "unit": "單元一：政府採購全生命週期概論", "question": "廠商如有違規棄土者，應要求限期清除；如未改善時，按契約規定應如何處理？", "options": {"A": "扣款", "B": "停止估驗", "C": "終止契約或移請直轄市、縣（市）政府依規定查處", "D": "以上皆是"}, "answer": "D"}, {"id": 10, "unit": "單元一：政府採購全生命週期概論", "question": "機關辦理工程採購估驗計價，除契約另有約定，一般每期估驗款須扣除多少百分比之保留款？", "options": {"A": "3％", "B": "5％", "C": "6％", "D": "7％"}, "answer": "B"}];
let qs=[], answers={}, idx=0;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function updateHistory(){const h=JSON.parse(localStorage.getItem('quizHistory')||'[]');document.getElementById('history').textContent=h.length?`最近成績：${h.slice(-5).reverse().map(x=>x+'分').join('、')}`:'尚無作答紀錄'}
function startQuiz(){qs=shuffle(bank);answers={};idx=0;show('quiz');render()}
function render(){
 const q=qs[idx];
 document.getElementById('count').textContent=`第 ${idx+1} / ${qs.length} 題`;
 document.getElementById('unit').textContent=q.unit;
 document.getElementById('bar').style.width=`${(idx+1)/qs.length*100}%`;
 document.getElementById('qid').textContent=`原題號 ${q.id}`;
 document.getElementById('question').textContent=q.question;
 const box=document.getElementById('options'); box.innerHTML='';
 ['A','B','C','D'].forEach(k=>{
   const label=document.createElement('label');label.className='option'+(answers[q.id]===k?' selected':'');
   label.innerHTML=`<input type="radio" name="opt" value="${k}" ${answers[q.id]===k?'checked':''}><b>${k}.</b> ${q.options[k]}`;
   label.onclick=()=>{answers[q.id]=k;render()};
   box.appendChild(label);
 });
}
function prevQ(){if(idx>0){idx--;render()}}
function nextQ(){if(idx<qs.length-1){idx++;render()}}
function submitQuiz(){
 let correct=0, mistakes=[];
 qs.forEach(q=>{const a=answers[q.id]; if(a===q.answer)correct++; else mistakes.push({q,a})});
 const score=Math.round(correct/qs.length*100);
 const h=JSON.parse(localStorage.getItem('quizHistory')||'[]');h.push(score);localStorage.setItem('quizHistory',JSON.stringify(h.slice(-20)));
 document.getElementById('score').textContent=`${score} 分`;
 document.getElementById('summary').textContent=`答對 ${correct} 題，答錯或未作答 ${qs.length-correct} 題`;
 const m=document.getElementById('mistakes');m.innerHTML=mistakes.length?'<h3>錯題檢討</h3>':'<h3>全部答對</h3>';
 mistakes.forEach(x=>{
   const d=document.createElement('div');d.className='mistake';
   d.innerHTML=`<div class="small">原題號 ${x.q.id}</div><div style="font-weight:700;line-height:1.5;margin:6px 0">${x.q.question}</div>
   <div>你的答案：${x.a||'未作答'}</div><div style="color:var(--ok);font-weight:700">正確答案：${x.q.answer}．${x.q.options[x.q.answer]}</div>`;
   m.appendChild(d);
 });
 show('result');window.scrollTo({top:0,behavior:'smooth'});
}
function goHome(){show('home');updateHistory()}
function clearHistory(){localStorage.removeItem('quizHistory');updateHistory()}
updateHistory();
</script>
</body>
</html>
