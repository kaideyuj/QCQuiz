<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2457d6"><title>淡江品管班題庫</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--text:#172033;--muted:#667085;--line:#d8dee9;--brand:#2457d6;--ok:#15803d;--bad:#c62828}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:840px;margin:auto;min-height:100vh;padding:16px 12px 42px}.top{background:linear-gradient(135deg,#173c9b,#2d6be8);color:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(36,87,214,.2)}.top h1{margin:0 0 6px;font-size:25px}.top p{margin:0;opacity:.92;line-height:1.5}.panel{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 5px 18px rgba(0,0,0,.06)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{align-items:stretch}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;min-height:48px}.primary{background:var(--brand);color:#fff}.secondary{background:#e8edf6;color:#172033}.grow{flex:1}.field{display:grid;gap:6px;margin:10px 0}.field select,.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:48px}.small{font-size:14px;color:var(--muted)}.hidden{display:none}.pill{display:inline-block;background:#edf2ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:13px}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:13px 0}.progress div{height:100%;background:var(--brand)}.qtitle{font-size:19px;line-height:1.65;font-weight:800;margin:14px 0}.option{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;line-height:1.55;cursor:pointer;user-select:none}.option.selected{border-color:var(--brand);background:#f3f7ff}.option input{margin-top:4px;transform:scale(1.15)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.score{font-size:42px;font-weight:900}.mistake{border-top:1px solid var(--line);padding:14px 0}.ok{color:var(--ok);font-weight:700}.error{color:var(--bad)}.audit{font-size:13px;color:var(--muted);margin-top:12px}.lookup-row{display:grid;grid-template-columns:1fr auto;gap:10px}@media(max-width:520px){.app{padding:10px}.qtitle{font-size:18px}.top{padding:18px}.row.stack{display:grid}.row.stack>*{width:100%}.lookup-row{grid-template-columns:1fr}.lookup-row button{width:100%}}
</style></head><body><div class="app"><section class="top"><h1>淡江品管班題庫</h1><p id="status">載入 v3 題庫中…</p></section><section id="home" class="panel"><div class="field"><label for="unit">出題範圍</label><select id="unit"><option value="">全部單元</option></select></div><div class="field"><label for="countSel">題數</label><select id="countSel"><option>10</option><option>20</option><option>50</option><option>100</option></select></div><div class="row stack"><button class="primary grow" onclick="startQuiz(false)">隨機出題</button><button class="secondary" onclick="startQuiz(true)">只考錯題</button><button class="secondary" onclick="clearRecords()">清除紀錄</button></div><div class="field"><label for="lookupId">依原題號查題</label><div class="lookup-row"><input id="lookupId" type="number" min="1" max="2648" placeholder="例如：174"><button class="secondary" onclick="lookupQuestion()">開啟題目</button></div></div><p id="history" class="small"></p><p class="audit">v3：題庫檔改名為 questions_v3.json，避免舊檔覆蓋或快取混用。</p></section><section id="quiz" class="panel hidden"><div class="row" style="justify-content:space-between"><span id="pos" class="pill"></span><span id="meta" class="small"></span></div><div class="progress"><div id="bar"></div></div><div id="qtext" class="qtitle"></div><div id="opts"></div><div class="nav"><button class="secondary" onclick="move(-1)">上一題</button><button class="primary" onclick="move(1)">下一題</button></div><button class="primary" style="width:100%;margin-top:10px" onclick="submitQuiz()">交卷</button></section><section id="result" class="panel hidden"><h2>測驗結果</h2><div id="score" class="score"></div><div id="summary" class="small"></div><div id="mistakes"></div><div class="row stack"><button class="primary grow" onclick="startQuiz(false)">重新測驗</button><button class="secondary" onclick="show('home');updateHistory()">回首頁</button></div></section></div>
<script>
const DATA_FILE='questions_v3.json';const DATA_VERSION='v3-20260721';let bank=[],qs=[],answers={},idx=0;const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function records(){try{return JSON.parse(localStorage.getItem('qcRecordsV3')||'{"history":[],"wrong":[]}')}catch{return {history:[],wrong:[]}}}function save(r){localStorage.setItem('qcRecordsV3',JSON.stringify(r))}function updateHistory(){const r=records();$('history').textContent=r.history.length?'最近成績：'+r.history.slice(-5).reverse().map(x=>x+'分').join('、')+'｜錯題庫 '+r.wrong.length+' 題':'尚無作答紀錄'}fetch(DATA_FILE+'?v='+DATA_VERSION,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{bank=data;$('status').textContent=`v3 題庫 ${bank.length.toLocaleString()} 題｜${DATA_FILE}`;[...new Set(bank.map(q=>q.unit))].filter(Boolean).forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;$('unit').appendChild(o)});updateHistory()}).catch(e=>{$('status').innerHTML='<span class="error">題庫載入失敗：請確認 index.html 與 questions_v3.json 在同一層。</span>'});function startQuiz(wrongOnly){if(!bank.length)return;let pool=bank;const unit=$('unit').value;if(unit)pool=pool.filter(q=>q.unit===unit);if(wrongOnly){const ids=new Set(records().wrong);pool=pool.filter(q=>ids.has(q.id));if(!pool.length){alert('目前沒有符合範圍的錯題');return}}const n=Math.min(+$('countSel').value,pool.length);qs=shuffle(pool).slice(0,n);answers={};idx=0;show('quiz');render()}function lookupQuestion(){if(!bank.length)return;const id=Number($('lookupId').value);const q=bank.find(x=>x.id===id);if(!q){alert('找不到該題號');return}qs=[q];answers={};idx=0;show('quiz');render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=qs[idx];$('pos').textContent=`第 ${idx+1} / ${qs.length} 題`;$('meta').textContent=`原題號 ${q.id}｜PDF第 ${q.page}頁`;$('bar').style.width=((idx+1)/qs.length*100)+'%';$('qtext').textContent=q.question;const box=$('opts');box.innerHTML='';for(const k of q.choice_order){const l=document.createElement('label');l.className='option'+(answers[q.id]===k?' selected':'');l.innerHTML=`<input type="radio" name="opt" ${answers[q.id]===k?'checked':''}><span><b>${k}.</b> ${escapeHtml(q.options[k])}</span>`;l.onclick=()=>{answers[q.id]=k;render()};box.appendChild(l)}}function move(d){idx=Math.max(0,Math.min(qs.length-1,idx+d));render()}function submitQuiz(){let correct=0,wrong=[];for(const q of qs){if(answers[q.id]===q.answer)correct++;else wrong.push(q)}const score=Math.round(correct/qs.length*100),r=records();r.history.push(score);r.history=r.history.slice(-30);const set=new Set(r.wrong);for(const q of qs){if(answers[q.id]===q.answer)set.delete(q.id);else set.add(q.id)}r.wrong=[...set];save(r);$('score').textContent=score+' 分';$('summary').textContent=`答對 ${correct} 題，答錯或未作答 ${qs.length-correct} 題`;const m=$('mistakes');m.innerHTML=wrong.length?'<h3>錯題檢討</h3>':'<h3>全部答對</h3>';wrong.forEach(q=>{const d=document.createElement('div');d.className='mistake';d.innerHTML=`<div class="small">原題號 ${q.id}｜PDF第 ${q.page}頁</div><div style="font-weight:700;line-height:1.5;margin:6px 0">${escapeHtml(q.question)}</div><div>你的答案：${answers[q.id]||'未作答'}</div><div class="ok">正確答案：${q.answer}．${escapeHtml(q.options[q.answer])}</div>`;m.appendChild(d)});show('result');scrollTo({top:0,behavior:'smooth'})}function clearRecords(){if(confirm('確定清除成績與錯題紀錄？')){localStorage.removeItem('qcRecordsV3');updateHistory()}}
</script></body></html>
